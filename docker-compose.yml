# Start:      docker compose up -d
# One-shot:   docker compose run --rm bw-backup --run-now
# Dry run:    docker compose run --rm bw-backup --dry-run
# Setup UI:   http://localhost:8080  (always available when container is running)

services:

  bw-backup:
    image: ghcr.io/reallovedone/bitwarden-kdbx-backup:1.0.1
    container_name: bitwarden-kdbx-backup
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"  # localhost only — do NOT expose to internet (plain HTTP)

    volumes:
      - ./config:/config
      - ./backups:/backups

    deploy:
      resources:
        limits:
          memory: 256M

    networks:
      - bw-net

networks:
  bw-net:
    driver: bridge
