# Development — builds image locally
#
# Build:     docker compose -f docker-compose.dev.yml build
# Start:     docker compose -f docker-compose.dev.yml up
# Dry run:    docker compose -f docker-compose.dev.yml run --rm bw-backup --dry-run
# Setup UI:   http://localhost:8080  (always available when container is running)

services:

  bw-backup:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BW_CLI_VERSION: "2026.4.2"
        # Set BW_CLI_SHA256 to the sha256 of bw-linux-2026.1.0.zip from the GitHub release page.
        # Leave empty to skip verification (not recommended for production builds).
        BW_CLI_SHA256: "431dbe784cc7de217cb3a826993eac451aa2fbaf336538c0ff6602c1ac884c91"
    image: bitwarden-kdbx-backup:dev
    container_name: bitwarden-kdbx-backup-dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./config:/config
      - ./backups:/backups
      # Uncomment for live code reload during development:
      # - ./bitwarden_backup.py:/app/bitwarden_backup.py
      # - ./daemon.py:/app/daemon.py
      # - ./setup_server.py:/app/setup_server.py
      # - ./config.py:/app/config.py

    deploy:
      resources:
        limits:
          memory: 256M

    networks:
      - bw-net

networks:
  bw-net:
    driver: bridge
